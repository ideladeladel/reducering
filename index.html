ull}}var ao=[{t:"1. L\xE4s in omg\xE5ngen",d:"G\xE5 till omg\xE5ngen hos BetMGM, markera matchlistan, kopiera. Tryck L\xE4s in omg\xE5ng, klistra in, Tolka. Lag, avsparkstider och radf\xF6rdelning hamnar p\xE5 plats. Fyll ocks\xE5 i omg\xE5ngs-id h\xF6gst upp \u2014 det numret m\xE5ste st\xE5 f\xF6rst i filen du laddar upp."},{t:"2. H\xE4mta odds",d:"Tryck Odds och klistra in din nyckel fr\xE5n the-odds-api.com. Verktyget letar upp matcherna gratis och betalar bara f\xF6r de ligor som faktiskt finns i kupongen. Matcher som inte hittas fyller du i f\xF6r hand under Odds-fliken vid kupongen. Odds beh\xF6vs f\xF6r spelv\xE4rde och f\xF6r en robusthet som bygger p\xE5 marknaden i st\xE4llet f\xF6r folkopinionen."},{t:"3. Bygg systemet",d:"Klicka i tecknen du vill ha. Ett tecken \xE4r en spik, tv\xE5 en halvgardering, tre en helgardering. Bottenraden visar hur m\xE5nga rader och vad det kostar. Vill du ha hj\xE4lp trycker du Generator, svarar p\xE5 sex fr\xE5gor och f\xE5r tre f\xF6rslag med motivering."},{t:"4. Reducera",d:"Villkoren i h\xF6gerspalten sk\xE4r bort rader ur grundramen. F\xE4rgreducering m\xE4rker enskilda tecken, teckenvillkor styr antalet ettor, kryss och tv\xE5or, streckvillkor s\xE5llar bort de mest spelade raderna. Radr\xE4knaren i botten uppdateras direkt."},{t:"5. Utv\xE4rdera",d:"Tryck Utv\xE4rdera. Verktyget j\xE4mf\xF6r ditt system med det b\xE4sta det sj\xE4lv hittar f\xF6r samma pengar, visar var systemet \xE4r k\xE4nsligt, vad varje villkor kostar och vilka enskilda \xE4ndringar som ger mest."},{t:"6. Exportera och r\xE4tta",d:"Tryck Exportera. Du f\xE5r en textfil som laddas upp hos BetMGM, och spelet sparas automatiskt i arkivet. N\xE4r matcherna avg\xF6rs klickar du i utfallen under Live-r\xE4ttning s\xE5 ser du hur m\xE5nga rader som fortfarande lever mot varje vinstgrupp."}],io=[{id:"kupong",t:"Kupongen",d:"En rad per match med tre teckenrutor. Klicka f\xF6r att strecka. Siffran uppe till h\xF6ger styrs av v\xE4xlaren ovanf\xF6r: streck, sannolikhet eller spelv\xE4rde. Nere till v\xE4nster st\xE5r oddset, nere till h\xF6ger hur stor andel av ditt reducerade system som anv\xE4nder tecknet. Guldstapeln i v\xE4nsterkanten visar att tecknet \xE4r streckat. Knappen 1X2 helgarderar raden, \xD7 nollst\xE4ller den."},{id:"visar",t:"V\xE4xlaren streck / sannolikhet / spelv\xE4rde",d:"Streck \xE4r radf\xF6rdelningen fr\xE5n BetMGM, allts\xE5 hur folket har spelat. Sannolikhet \xE4r oddsen med spelbolagets marginal bortr\xE4knad, s\xE5 de tre talen summerar till 100 procent. Spelv\xE4rde \xE4r sannolikheten delat med streckandelen: \xF6ver 1,05 gr\xF6nt betyder understreckat, under 0,95 r\xF6tt betyder \xF6verspelat."},{id:"grid",t:"Flikarna odds, streck och po\xE4ng",d:"Rutn\xE4tet under kupongen. Odds fylls i automatiskt vid h\xE4mtning eller f\xF6r hand. Streck l\xE4ses in med omg\xE5ngen. Po\xE4ng s\xE4tter du sj\xE4lv, 1 till 99 per tecken, och anv\xE4nds av po\xE4ngreduceringen."},{id:"lasin",t:"L\xE4s in omg\xE5ng",d:"Klistra in matchlistan fr\xE5n BetMGM. Har du redan ett bygge ig\xE5ng kan du v\xE4lja Uppdatera odds och streck i st\xE4llet f\xF6r Ers\xE4tt allt \u2014 d\xE5 r\xF6rs inte dina streckade tecken, f\xE4rger eller villkor. Rutan tar \xE4ven emot kupongkoder fr\xE5n en annan enhet."},{id:"odds",t:"Odds",d:"H\xE4mtar 1X2-odds som medianen \xF6ver europeiska bokmakare. Ligorna letas upp utan att kosta krediter; bara de ligor kupongen inneh\xE5ller debiteras, en kredit per liga. Siffran i knappen visar hur m\xE5nga krediter du har kvar. Matcher som inte hittas kan v\xE4ljas manuellt ur listan."},{id:"generator",t:"Generator",d:"Sex fr\xE5gor om budget, m\xE5l, avvikelse fr\xE5n folkopinionen, l\xE5sta streckningar, f\xF6rdelning och villkor. Verktyget bygger ett fyrtiotal system inom din budget, k\xF6r var och en genom simuleringen och visar tre f\xF6rslag som skiljer sig i uppbyggnad, med motivering byggd av faktiska siffror."},{id:"utvardera",t:"Utv\xE4rdera",d:"G\xF6r ingenting med ditt system utan att du s\xE4ger till. Visar v\xE4rdet, en m\xE5ttstock mot det b\xE4sta systemet f\xF6r samma pengar, vilka matcher systemet \xE4r k\xE4nsligast f\xF6r, vad varje villkor kostar i vinstchans, de b\xE4sta enskilda \xE4ndringarna, och hur folklig kupongen \xE4r."},{id:"arkiv",t:"Arkiv",d:"Varje export sparas automatiskt med omg\xE5ng, radantal och kostnad. \xD6ppna ett spel f\xF6r att r\xE4tta det, fyll i faktisk vinst, och se insats, vinst och netto \xF6ver alla spel. S\xE4kerhetskopiera laddar ner arkivet som en fil \u2014 g\xF6r det d\xE5 och d\xE5, eftersom allt ligger i webbl\xE4saren."},{id:"systemkod",t:"Systemkod",d:"Packar hela arbetsl\xE4get till en textrad eller en l\xE4nk: matcher, odds, streck, streckade tecken, f\xE4rger, villkor och r\xE4ttning. Anv\xE4nd den f\xF6r att flytta ett bygge till telefonen eller till en nyare version av verktyget."},{id:"angra",t:"\xC5ngra",d:"Dyker upp n\xE4r n\xE5got gjorts som g\xE5r att ta tillbaka, och tar dig ett steg bak\xE5t. T\xE4cker generatorns f\xF6rslag, f\xF6rb\xE4ttringar, h\xE4mtade odds, inl\xE4st omg\xE5ng, systemkod, arkivspel och Rensa."},{id:"farg",t:"F\xE4rgreducering",d:"V\xE4lj en f\xE4rg och klicka p\xE5 streckade tecken i kupongen f\xF6r att m\xE4rka dem. S\xE4tt sedan minst och h\xF6gst antal av f\xE4rgens tecken som f\xE5r sl\xE5 in i en rad. Ett tecken kan b\xE4ra flera f\xE4rger och delar d\xE5 rutan. Fyra f\xE4rger som standard, upp till \xE5tta om du l\xE4gger till fler."},{id:"tecken",t:"Teckenvillkor",d:"Minsta och h\xF6gsta antal ettor, kryss respektive tv\xE5or per rad. Ett tak p\xE5 kryss \xE4r det snabbaste s\xE4ttet att st\xE4da bort osannolika rader."},{id:"streckvillkor",t:"Streckvillkor",d:"Summan av radf\xF6rdelningen f\xF6r radens tecken. Ett tak s\xE5llar bort de mest spelade raderna, allts\xE5 de du annars skulle dela potten med. Ett golv g\xF6r tv\xE4rtom och h\xE5ller dig n\xE4ra folkopinionen."},{id:"spelvarde",t:"Spelv\xE4rdesvillkor",d:"Summan av radens spelv\xE4rden i hundradelar. En rad med bara neutrala tecken landar p\xE5 100 g\xE5nger antalet matcher. Ett golv strax \xF6ver det s\xE5llar bort rader som enbart f\xF6ljer folkopinionen. Kr\xE4ver b\xE5de odds och streck."},{id:"poang",t:"Po\xE4ngreducering",d:"Du s\xE4tter sj\xE4lv 1 till 99 po\xE4ng per tecken under Po\xE4ng-fliken och anger minsta och h\xF6gsta totalsumma per rad. Det mest flexibla villkoret, men kr\xE4ver att du \xE4r konsekvent med skalan."},{id:"prognos",t:"Prognos",d:"Grundramens storlek, hur m\xE5nga rader som \xE5terst\xE5r efter reducering, kostnad, hur m\xE5nga matcher som har odds, oddsspann och v\xE4ntad utdelning. H\xE4r s\xE4tter du ocks\xE5 radpris och budgettak \u2014 \xF6verskrids taket l\xE5ses exporten."},{id:"pott",t:"Pott och utdelning",d:"Fyll i antal inl\xE4mnade rader i omg\xE5ngen och potten per vinstgrupp, siffror som st\xE5r p\xE5 omg\xE5ngens sida. D\xE5 kan verktyget r\xE4kna v\xE4ntad utdelning i st\xE4llet f\xF6r bara sannolikhet: en rad som m\xE5nga andra spelar delar potten och \xE4r v\xE4rd mindre \xE4ven om den vinner lika ofta."},{id:"live",t:"Live-r\xE4ttning",d:"Klicka i utfallen efterhand som matcherna avg\xF6rs. Verktyget r\xE4knar direkt hur m\xE5nga av dina rader som fortfarande kan n\xE5 varje vinstgrupp. \xD6ppnar du ett spel ur arkivet skrivs r\xE4ttningen tillbaka dit automatiskt."},{id:"robusthet",t:"Robusthet",d:"Simulerar fyra tusen t\xE4nkbara utfall och r\xE4knar hur m\xE5nga rader som landar i varje vinstgrupp. Visar vad reduceringen kostar i de l\xE4gre grupperna, vilket \xE4r den vanligaste dyra missen: man reducerar bort rader som inte gett h\xF6gsta vinsten men v\xE4l en l\xE4gre."},{id:"export",t:"Fil och Exportera",d:"Exportera skapar textfilen du laddar upp hos BetMGM: omg\xE5ngs-id p\xE5 f\xF6rsta raden, sedan en rad per enkelrad med prefixet E. Under Fil st\xE4ller du in radbrytning och hur m\xE5nga rader varje fil f\xE5r inneh\xE5lla, och kan h\xE4mta en testfil p\xE5 fyra rader f\xF6r att kontrollera formatet."}],po=[{t:"Spik",d:"Ett enda tecken i en match. G\xE5r den emot dig \xE4r hela systemet ute ur toppgruppen."},{t:"Halvgardering",d:"Tv\xE5 tecken i en match. Dubblar antalet rader."},{t:"Helgardering",d:"Alla tre tecken. Tredubblar antalet rader men matchen kan aldrig f\xE4lla dig."},{t:"Grundram",d:"Alla kombinationer som dina streckade tecken ger, innan villkoren skurit bort n\xE5got. Antalet \xE4r produkten av antalet tecken per match."},{t:"Reducering",d:"Att sk\xE4ra bort rader ur grundramen enligt regler, i st\xE4llet f\xF6r att stryka garderingar. Du beh\xE5ller bredden d\xE4r den beh\xF6vs och betalar f\xF6r f\xE4rre rader."},{t:"Enkelrad",d:"En f\xE4rdig rad med exakt ett tecken per match. Det \xE4r enkelrader som skickas i filen till BetMGM."},{t:"Streck eller radf\xF6rdelning",d:"Hur stor andel av alla inl\xE4mnade rader som har ett visst tecken. Visas av BetMGM per match. S\xE4ger vad folket tror, inte vad som \xE4r sannolikt."},{t:"Spelv\xE4rde",d:"Marknadens sannolikhet delat med folkets andel. \xD6ver 1 betyder att tecknet \xE4r understreckat i f\xF6rh\xE5llande till oddset. Ett h\xF6gt spelv\xE4rde betyder inte att tecknet vinner, bara att det ger mer betalt om det g\xF6r det."},{t:"Vinstgrupp",d:"Niv\xE5 som ger utdelning. Fotboll 12 och 13 betalar p\xE5 tre niv\xE5er, allts\xE5 \xE4ven n\xE4r en eller tv\xE5 matcher g\xE5r emot dig. \xD6vriga produkter kr\xE4ver alla r\xE4tt."},{t:"Omg\xE5ngs-id",d:"BetMGM:s nummer f\xF6r omg\xE5ngen. St\xE5r under Information p\xE5 omg\xE5ngens sida och m\xE5ste st\xE5 p\xE5 filens f\xF6rsta rad."},{t:"Utsp\xE4dning",d:"Att dela potten med andra som spelat samma rad. D\xE4rf\xF6r \xE4r en folklig rad v\xE4rd mindre \xE4n en udda rad med samma sannolikhet."}];function co(){let[n,l]=O(typeof window<"u"?window.innerWidth<720:!1);return fe(()=>{let o=()=>l(window.innerWidth<720);return window.addEventListener("resize",o),window.addEventListener("orientationchange",o),()=>{window.removeEventListener("res
